name: Audit roll-call concentration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_rollcall_concentration.py"
      - "data/legislative/2026/rollcall_model_eligibility.csv"
      - "data/legislative/2026/projects.csv"
      - "data/legislative/2026/topics/rollcall_inherited_topic_final.csv"
      - ".github/workflows/audit_rollcall_concentration.yml"

permissions:
  contents: write

concurrency:
  group: rollcall-concentration
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit roll-call concentration
        run: python scripts/audit_rollcall_concentration.py

      - name: Persist concentration audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/legislative/2026/rollcall_concentration_by_bill.csv \
            data/legislative/2026/rollcall_concentration_diagnostics.json
          if git diff --cached --quiet; then
            echo "No concentration-audit changes to commit"
          else
            git commit -m "Actualiza auditoría de concentración roll-call"
            git pull --rebase origin main
            git push origin main
          fi
