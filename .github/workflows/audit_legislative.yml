name: Audit legislative data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_legislative_data.py"
      - ".github/workflows/audit_legislative.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit legislative database
        run: python scripts/audit_legislative_data.py

      - name: Persist audit report
        shell: bash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/AUDIT.md data/legislative/2026/audit_diagnostics.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "Actualiza auditoría legislativa 2026"
            git pull --rebase origin main
            git push origin main
          fi
