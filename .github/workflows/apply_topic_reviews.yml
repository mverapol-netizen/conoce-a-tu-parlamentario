name: Apply topic reviews

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 5"
  push:
    paths:
      - "scripts/apply_topic_reviews.py"
      - "data/legislative/2026/topics/topic_model_overrides.csv"
      - ".github/workflows/apply_topic_reviews.yml"

permissions:
  contents: write

concurrency:
  group: legislative-topic-reviews
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reviewed overrides
        run: python scripts/apply_topic_reviews.py

      - name: Persist final thematic layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/topics/project_topic_final.csv \
                  data/legislative/2026/topics/project_topics_final.csv \
                  data/legislative/2026/topics/topic_review_queue_remaining.csv \
                  data/legislative/2026/topics/topic_final_diagnostics.json
          if git diff --cached --quiet; then
            echo "No reviewed-topic changes"
          else
            git commit -m "Actualiza capa temática revisada 2026"
            git push origin main
          fi
