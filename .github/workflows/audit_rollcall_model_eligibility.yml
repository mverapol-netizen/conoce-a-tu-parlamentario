name: Audit roll-call model eligibility

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_rollcall_model_eligibility.py"
      - "data/legislative/2026/rollcall_matrix_metadata.csv"
      - "data/legislative/2026/member_votes_enriched.csv"
      - "data/legislative/2026/topics/rollcall_topic_map.csv"
      - "data/legislative/2026/topics/project_topic_final.csv"
      - "data/legislative/2026/topics/rollcall_inherited_topic_final.csv"
      - ".github/workflows/audit_rollcall_model_eligibility.yml"

permissions:
  contents: write

concurrency:
  group: rollcall-model-eligibility
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit roll-call eligibility sensitivity
        run: python scripts/audit_rollcall_model_eligibility.py

      - name: Persist eligibility audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/legislative/2026/rollcall_model_eligibility.csv \
            data/legislative/2026/rollcall_model_sensitivity.csv \
            data/legislative/2026/rollcall_model_sensitivity_by_topic.csv \
            data/legislative/2026/rollcall_model_sensitivity_by_origin.csv \
            data/legislative/2026/rollcall_model_eligibility_diagnostics.json
          if git diff --cached --quiet; then
            echo "No eligibility-audit changes to commit"
          else
            git commit -m "Actualiza auditoría de elegibilidad roll-call"
            git pull --rebase origin main
            git push origin main
          fi
