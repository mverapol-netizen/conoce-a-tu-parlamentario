name: Sync affiliation history

on:
  workflow_dispatch:
  schedule:
    # Viernes, una hora antes del sincronizador legislativo pesado.
    - cron: "15 10 * * 5"
  push:
    paths:
      - "scripts/sync_political.py"
      - "scripts/sync_affiliation_history.py"
      - "data/legislative/2026/affiliations/affiliation_manual_events.csv"
      - "data/legislative/2026/affiliations/party_term_start_baseline.csv"
      - "data/legislative/2026/affiliations/caucus_term_start_baseline.csv"
      - ".github/workflows/sync_affiliations.yml"

permissions:
  contents: write

concurrency:
  group: parliamentary-affiliation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh current party and caucus from Cámara
        run: python scripts/sync_political.py

      - name: Append snapshot and rebuild temporal history
        run: python scripts/sync_affiliation_history.py

      - name: Persist affiliation history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/profiles.js \
                  data/legislative/2026/affiliations/affiliation_snapshots.csv \
                  data/legislative/2026/affiliations/affiliation_detected_events.csv \
                  data/legislative/2026/affiliations/affiliation_history.csv \
                  data/legislative/2026/affiliations/affiliation_diagnostics.json
          if git diff --cached --quiet; then
            echo "No affiliation changes"
          else
            git commit -m "Actualiza historial de partidos y bancadas 2026"
            git pull --rebase origin main
            git push origin main
          fi
