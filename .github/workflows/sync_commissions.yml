name: Sync current commissions

on:
  workflow_dispatch:
  schedule:
    - cron: "25 11 * * 1"
  push:
    paths:
      - "scripts/build_commissions_snapshot.py"
      - "scripts/build_commission_activity_snapshot.py"
      - ".github/workflows/sync_commissions.yml"

permissions:
  contents: write

concurrency:
  group: commissions-sync
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build commissions directory snapshot
        run: python scripts/build_commissions_snapshot.py

      - name: Build commission activity snapshot
        run: python scripts/build_commission_activity_snapshot.py

      - name: Persist snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/commissions/commissions_snapshot.json
          git add data/legislative/2026/commissions/commission_activity_snapshot.json
          if git diff --cached --quiet; then
            echo "No commission changes to commit"
          else
            git commit -m "Actualiza directorio y actividad institucional de comisiones"
            git pull --rebase origin main
            git push origin main
          fi
