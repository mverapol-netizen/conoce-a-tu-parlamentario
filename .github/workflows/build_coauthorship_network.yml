name: Build coauthorship network

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Sync legislative data"
    types:
      - completed
  push:
    paths:
      - "scripts/build_coauthorship_network.py"
      - ".github/workflows/build_coauthorship_network.yml"

permissions:
  contents: write

concurrency:
  group: coauthorship-network-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build derived coauthorship network
        run: python scripts/build_coauthorship_network.py

      - name: Persist derived network
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/legislative/2026/coauthorship_nodes.csv \
            data/legislative/2026/coauthorship_edges.csv \
            data/legislative/2026/coauthorship_diagnostics.json
          if git diff --cached --quiet; then
            echo "No coauthorship changes to commit"
          else
            git commit -m "Actualiza red de coautorías 2026"
            git pull --rebase origin main
            git push origin main
          fi
