name: Build remaining topic review

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_remaining_topic_review.py'
      - 'data/legislative/2026/topics/topic_review_queue_remaining.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact remaining review
        run: python scripts/build_remaining_topic_review.py
      - name: Persist compact queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/topics/topic_review_remaining_compact.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Actualiza cola compacta de revisión temática"
            git pull --rebase origin main
            git push
          fi
