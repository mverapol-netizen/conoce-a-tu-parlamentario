name: Build member participation

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_member_participation.py"
      - "data/legislative/2026/member_votes.csv"
      - "data/legislative/2026/rollcalls.csv"
      - ".github/workflows/build_member_participation.yml"

permissions:
  contents: write

concurrency:
  group: member-participation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build participation summary
        run: python scripts/build_member_participation.py

      - name: Persist participation summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/member_participation_summary.csv \
                  data/legislative/2026/member_participation_diagnostics.json
          if git diff --cached --quiet; then
            echo "No participation-summary changes"
          else
            git commit -m "Actualiza resumen individual de participación"
            git pull --rebase origin main
            git push origin main
          fi
