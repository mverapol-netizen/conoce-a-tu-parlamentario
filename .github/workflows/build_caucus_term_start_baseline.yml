name: Build caucus term-start baseline

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_caucus_term_start_baseline.py"
      - "data/legislative/2026/affiliations/party_term_start_baseline.csv"
      - "data/legislative/2026/affiliations/election_baseline_2025.csv"
      - "data/legislative/2026/affiliations/affiliation_manual_events.csv"
      - ".github/workflows/build_caucus_term_start_baseline.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build caucus baseline
        run: python scripts/build_caucus_term_start_baseline.py

      - name: Persist baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/affiliations/caucus_term_start_baseline.csv \
                  data/legislative/2026/affiliations/caucus_term_start_baseline_diagnostics.json
          if git diff --cached --quiet; then
            echo "No caucus baseline changes"
          else
            git commit -m "Construye línea base de bancadas de marzo 2026"
            git pull --rebase origin main
            git push origin main
          fi
