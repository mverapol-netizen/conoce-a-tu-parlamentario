name: Derive topic signals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 5"
  push:
    paths:
      - "scripts/derive_topic_signals.py"
      - "docs/METODO_TEMATICO_INSTITUCIONAL_V0_2.md"
      - ".github/workflows/derive_topic_signals.yml"

permissions:
  contents: write

concurrency:
  group: derive-topic-signals
  cancel-in-progress: true

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive institutional topic signals
        run: python scripts/derive_topic_signals.py

      - name: Persist topic signals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/legislative/2026/topics/project_commissions.csv \
            data/legislative/2026/topics/project_topic_signals.csv \
            data/legislative/2026/topics/topic_signal_diagnostics.json
          if git diff --cached --quiet; then
            echo "No topic-signal changes to commit"
          else
            git commit -m "Actualiza señales temáticas institucionales"
            git push origin main
          fi
