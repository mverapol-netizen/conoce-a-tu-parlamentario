name: Audit roll-call redundancy

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_rollcall_redundancy.py"
      - "data/legislative/2026/rollcall_model_eligibility.csv"
      - "data/legislative/2026/member_votes_enriched.csv"
      - ".github/workflows/audit_rollcall_redundancy.yml"

permissions:
  contents: write

concurrency:
  group: rollcall-redundancy
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit exact vote-pattern redundancy
        run: python scripts/audit_rollcall_redundancy.py

      - name: Persist redundancy audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/legislative/2026/rollcall_redundancy_by_bill.csv \
            data/legislative/2026/rollcall_redundancy_diagnostics.json
          if git diff --cached --quiet; then
            echo "No redundancy-audit changes to commit"
          else
            git commit -m "Actualiza auditoría de redundancia roll-call"
            git pull --rebase origin main
            git push origin main
          fi
