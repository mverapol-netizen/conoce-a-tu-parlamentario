name: Audit roll-call topic coverage

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_rollcall_topic_coverage.py"
      - "data/legislative/2026/rollcalls.csv"
      - "data/legislative/2026/topics/project_topics_final.csv"
      - ".github/workflows/audit_rollcall_topic_coverage.yml"

permissions:
  contents: write

concurrency:
  group: rollcall-topic-coverage
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit topic coverage of floor votes
        run: python scripts/audit_rollcall_topic_coverage.py

      - name: Persist diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/topics/rollcall_topic_missing.csv \
                  data/legislative/2026/topics/rollcall_topic_coverage_diagnostics.json
          if git diff --cached --quiet; then
            echo "No coverage changes"
          else
            git commit -m "Actualiza cobertura temática de votaciones de Sala"
            git pull --rebase origin main
            git push origin main
          fi
