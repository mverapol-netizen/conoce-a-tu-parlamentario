name: Build public modal agreement

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_modal_agreement_public.py"
      - "data/legislative/2026/member_modal_agreement_loo.csv"
      - "data/legislative/2026/member_votes_enriched.csv"
      - "data/legislative/2026/group_rollcall_behavior.csv"
      - ".github/workflows/build_modal_agreement_public.yml"

permissions:
  contents: write

concurrency:
  group: public-modal-agreement
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build public modal agreement assets
        run: python scripts/build_modal_agreement_public.py

      - name: Persist public modal agreement assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A permite registrar tanto archivos nuevos por parlamentario como la
          # eliminación del antiguo JSON monolítico durante la migración.
          git add -A assets/js/modal_agreement.js \
                     assets/data \
                     data/legislative/2026/member_modal_agreement_public_diagnostics.json
          if git diff --cached --quiet; then
            echo "No public modal-agreement changes"
          else
            git commit -m "Actualiza activos públicos de coincidencia modal"
            git pull --rebase origin main
            git push origin main
          fi
