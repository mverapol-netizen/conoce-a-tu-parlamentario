name: Plot W-NOMINATE research

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/plot_wnominate_research.R'
      - 'data/legislative/2026/wnominate/research_1d/**'
      - 'data/legislative/2026/wnominate/two_dimensional/**'
      - 'data/legislative/2026/affiliations/affiliation_snapshots.csv'
      - '.github/workflows/plot_wnominate_research.yml'

permissions:
  contents: write

concurrency:
  group: plot-wnominate-research
  cancel-in-progress: true

jobs:
  plot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install plotting dependencies
        shell: bash
        run: |
          Rscript -e 'install.packages(c("ggplot2"), repos="https://cloud.r-project.org")'

      - name: Generate W-NOMINATE figures
        shell: bash
        run: Rscript scripts/plot_wnominate_research.R

      - name: Persist figures
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/wnominate/figures
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
            exit 0
          fi
          git commit -m "Actualiza figuras W-NOMINATE research 2026"
          git pull --rebase origin main
          git push origin main
