name: Pilot legislative data contract

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/congress_api.py"
      - "scripts/pilot_legislative.py"
      - "docs/CONTRATO_DATOS_LEGISLATIVOS.md"
      - ".github/workflows/pilot_legislative.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run legislative pilot
        run: python scripts/pilot_legislative.py

      - name: Commit pilot outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/pilot
          if git diff --cached --quiet; then
            echo "No pilot changes to commit"
          else
            git commit -m "Genera piloto de datos legislativos 2026"
            git pull --rebase origin main
            git push origin main
          fi
