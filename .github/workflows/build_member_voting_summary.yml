name: Build member modal agreement

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_member_voting_summary.py"
      - "data/legislative/2026/member_votes_enriched.csv"
      - "data/legislative/2026/group_rollcall_behavior.csv"
      - ".github/workflows/build_member_voting_summary.yml"

permissions:
  contents: write

concurrency:
  group: member-modal-agreement
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build modal agreement summaries
        run: python scripts/build_member_voting_summary.py

      - name: Persist modal agreement summaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/member_modal_agreement.csv \
                  data/legislative/2026/member_voting_summary_diagnostics.json
          if git diff --cached --quiet; then
            echo "No modal-agreement changes"
          else
            git commit -m "Actualiza coincidencia modal individual"
            git pull --rebase origin main
            git push origin main
          fi
