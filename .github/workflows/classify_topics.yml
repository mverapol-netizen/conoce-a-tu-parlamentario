name: Classify legislative topics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 5"
  push:
    paths:
      - "scripts/classify_topics_hybrid.py"
      - "scripts/derive_topic_signals.py"
      - ".github/workflows/classify_topics.yml"

permissions:
  contents: write

concurrency:
  group: legislative-topic-classifier
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify topics
        run: python scripts/classify_topics_hybrid.py

      - name: Persist classifications
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/topics/project_topic_classification.csv \
                  data/legislative/2026/topics/project_topics.csv \
                  data/legislative/2026/topics/topic_review_queue.csv \
                  data/legislative/2026/topics/topic_classifier_diagnostics.json
          if git diff --cached --quiet; then
            echo "No topic-classification changes to commit"
          else
            git commit -m "Actualiza clasificación temática legislativa 2026"
            git push origin main
          fi
