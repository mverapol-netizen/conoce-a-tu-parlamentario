name: Run diagnostic 2D W-NOMINATE

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_wnominate_2d_diagnostic.R"
      - "data/legislative/2026/rollcall_matrix_binary.csv"
      - "data/legislative/2026/rollcall_matrix_metadata.csv"
      - ".github/workflows/run_wnominate_2d_diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: diagnostic-2d-wnominate
  cancel-in-progress: true

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("pscl", "wnominate", "jsonlite"), repos = "https://cloud.r-project.org")

      - name: Run 2D diagnostic specifications
        run: Rscript scripts/run_wnominate_2d_diagnostic.R

      - name: Persist 2D diagnostic outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/wnominate/two_dimensional
          if git diff --cached --quiet; then
            echo "No 2D W-NOMINATE changes to commit"
          else
            git commit -m "Actualiza diagnóstico W-NOMINATE 2D 2026"
            git pull --rebase origin main
            git push origin main
          fi
