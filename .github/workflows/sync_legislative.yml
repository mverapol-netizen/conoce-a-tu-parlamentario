name: Sync legislative data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * 5"
  push:
    paths:
      - "scripts/congress_api.py"
      - "scripts/legislative_common.py"
      - "scripts/sync_bills.py"
      - "scripts/sync_authorship.py"
      - "scripts/sync_floor_votes.py"
      - "scripts/audit_legislative_data.py"
      - ".github/workflows/sync_legislative.yml"

permissions:
  contents: write

concurrency:
  group: legislative-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Sync projects and legislative course
        run: python scripts/sync_bills.py

      - name: Persist projects
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026
          if git diff --cached --quiet; then
            echo "No project changes to commit"
          else
            git commit -m "Actualiza proyectos legislativos 2026"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Sync parliamentary authorship
        run: python scripts/sync_authorship.py

      - name: Persist authorship
        shell: bash
        run: |
          git add data/legislative/2026
          if git diff --cached --quiet; then
            echo "No authorship changes to commit"
          else
            git commit -m "Actualiza autorías legislativas 2026"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Sync floor roll calls
        run: python scripts/sync_floor_votes.py

      - name: Persist floor votes
        shell: bash
        run: |
          git add data/legislative/2026
          if git diff --cached --quiet; then
            echo "No floor-vote changes to commit"
          else
            git commit -m "Actualiza votaciones de Sala 2026"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Audit legislative database
        run: python scripts/audit_legislative_data.py

      - name: Persist audit report
        shell: bash
        run: |
          git add data/legislative/2026/AUDIT.md data/legislative/2026/audit_diagnostics.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "Actualiza auditoría legislativa 2026"
            git pull --rebase origin main
            git push origin main
          fi
