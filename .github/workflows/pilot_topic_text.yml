name: Pilot topic text audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/pilot_topic_text.py"
      - "docs/TAXONOMIA_TEMATICA_V0_1.md"
      - ".github/workflows/pilot_topic_text.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pypdf

      - name: Audit initiative text availability
        run: python scripts/pilot_topic_text.py

      - name: Persist topic-text pilot
        shell: bash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/topic_pilot
          if git diff --cached --quiet; then
            echo "No topic-pilot changes to commit"
          else
            git commit -m "Actualiza piloto de textos temáticos"
            git pull --rebase origin main
            git push origin main
          fi
