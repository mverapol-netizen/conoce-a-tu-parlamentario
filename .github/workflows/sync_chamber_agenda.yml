name: Sync chamber agenda snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "10 11 * * 1-5"
  push:
    paths:
      - "scripts/congress_api.py"
      - "scripts/build_chamber_agenda_snapshot.py"
      - ".github/workflows/sync_chamber_agenda.yml"

permissions:
  contents: write

concurrency:
  group: chamber-agenda-sync
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Build Sala snapshot
        run: python scripts/build_chamber_agenda_snapshot.py

      - name: Persist snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/agenda/sala_snapshot.json
          if git diff --cached --quiet; then
            echo "No agenda changes to commit"
          else
            git commit -m "Actualiza agenda diaria de Sala"
            git pull --rebase origin main
            git push origin main
          fi
