name: Build public coauthorship module

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_public_coauthorship_module.py"
      - "data/legislative/2026/bill_authors.csv"
      - "data/legislative/2026/projects.csv"
      - "data/legislative/2026/coauthorship_edges.csv"
      - "assets/js/profiles.js"
      - ".github/workflows/build_public_coauthorship_module.yml"

permissions:
  contents: write

concurrency:
  group: build-public-coauthorship-module
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build public coauthorship module
        run: python scripts/build_public_coauthorship_module.py

      - name: Persist public coauthorship assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/js/coauthorship.js \
                     assets/data/coauthorship \
                     data/legislative/2026/member_coauthorship_summary.csv \
                     data/legislative/2026/public_coauthorship_diagnostics.json
          if git diff --cached --quiet; then
            echo "No coauthorship changes"
          else
            git commit -m "Actualiza activos públicos de coautoría"
            git pull --rebase origin main
            git push origin main
          fi
