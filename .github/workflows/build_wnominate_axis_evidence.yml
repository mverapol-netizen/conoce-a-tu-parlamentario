name: Build W-NOMINATE axis evidence

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_wnominate_axis_evidence.py'
      - 'data/legislative/2026/rollcalls.csv'
      - 'data/legislative/2026/projects.csv'
      - 'data/legislative/2026/member_votes_enriched.csv'
      - 'data/legislative/2026/topics/rollcall_inherited_topic_final.csv'
      - 'data/legislative/2026/wnominate/research_1d/rollcall_coordinates_research.csv'
      - 'data/legislative/2026/wnominate/two_dimensional/top_dim2_rollcalls.csv'
      - '.github/workflows/build_wnominate_axis_evidence.yml'

permissions:
  contents: write

concurrency:
  group: build-wnominate-axis-evidence
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align with latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Build axis evidence
        shell: bash
        run: python scripts/build_wnominate_axis_evidence.py

      - name: Persist interpretation evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legislative/2026/wnominate/interpretation
          if git diff --cached --quiet; then
            echo "No interpretation evidence changes to commit."
            exit 0
          fi
          git commit -m "Actualiza evidencia de interpretación W-NOMINATE 2026"
          git pull --rebase origin main
          git push origin main
